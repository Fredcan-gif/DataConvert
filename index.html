<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV to JSON Converter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    header { border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; padding-bottom: 1rem; }
    h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
    .meta { margin: 0; color: #555; }
    form { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    button { padding: .5rem 1rem; cursor: pointer; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 6px; overflow-x: auto; min-height: 3rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <h1>YOUR FULL NAME</h1>
    <p class="meta">Schedule: YOUR SCHEDULE (e.g. Mon/Wed 1:00 PM - 4:00 PM)</p>
  </header>

  <h2>CSV to JSON Converter</h2>
  <form id="form">
    <input type="file" id="file" accept=".csv" required>
    <button type="submit">Convert</button>
    <button type="button" id="download" disabled>Download JSON</button>
  </form>

  <h3>Output</h3>
  <pre id="output">Upload a CSV file to see the JSON here.</pre>

  <script>
    // ===== CONVERSION LOGIC =====
    // Course code -> full program name (edit to match your CSV)
    const PROGRAMS = {
      BSIT: "Bachelor of Science in Information Technology",
      BSCS: "Bachelor of Science in Computer Science",
      BSIS: "Bachelor of Science in Information Systems",
      BSBA: "Bachelor of Science in Business Administration",
      BSA: "Bachelor of Science in Accountancy",
      BSN: "Bachelor of Science in Nursing",
      BSED: "Bachelor of Science in Education",
      BSCE: "Bachelor of Science in Civil Engineering",
      BSCPE: "Bachelor of Science in Computer Engineering",
      BSHM: "Bachelor of Science in Hospitality Management",
      BSTM: "Bachelor of Science in Tourism Management",
      BSPSY: "Bachelor of Science in Psychology",
    };

    // Parses CSV text into an array of rows (handles quoted fields and commas inside quotes)
    function parseCSV(text) {
      const rows = [];
      let row = [], field = "", inQuotes = false;
      text = text.replace(/^﻿/, "");
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (c === '"') inQuotes = false;
          else field += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(field); field = "";
          rows.push(row); row = [];
        } else field += c;
      }
      if (field !== "" || row.length) { row.push(field); rows.push(row); }
      return rows.filter(r => r.some(v => v.trim() !== ""));
    }

    const capitalizeFirst = (v) => {
      v = (v || "").trim();
      return v.charAt(0).toUpperCase() + v.slice(1);
    };

    function toInt(v, name) {
      const n = parseInt(String(v).trim(), 10);
      if (Number.isNaN(n)) throw new Error(`Invalid integer in "${name}": ${v}`);
      return n;
    }

    function toMoney(v, name) {
      const n = parseFloat(String(v).trim().replace(/[,$₱]/g, ""));
      if (Number.isNaN(n)) throw new Error(`Invalid number in "${name}": ${v}`);
      return n.toFixed(2); // string like "1500.00", written to JSON as a number
    }

    function fullProgram(c) {
      c = (c || "").trim();
      return PROGRAMS[c.toUpperCase()] || c;
    }

    function transform(r) {
      return {
        studentId: toInt(r.student_id, "student_id"),
        firstName: capitalizeFirst(r.first_name),
        lastName: capitalizeFirst(r.last_name),
        program: fullProgram(r.course),
        yearLevel: toInt(r.year_level, "year_level"),
        emailAddress: (r.email || "").trim().toLowerCase(),
        outstandingBalance: toMoney(r.tuition_balance, "tuition_balance"),
      };
    }

    function convert(text) {
      const rows = parseCSV(text);
      if (rows.length < 2) throw new Error("CSV has no data rows.");
      const headers = rows[0].map(h => h.trim().toLowerCase());
      const required = ["student_id","first_name","last_name","course","year_level","email","tuition_balance"];
      const missing = required.filter(h => !headers.includes(h));
      if (missing.length) throw new Error("Missing column(s): " + missing.join(", "));

      const result = rows.slice(1).map(values => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = values[i] ?? "");
        return transform(obj);
      });
      // Write outstandingBalance as a JSON number that keeps 2 decimals (e.g. 1500.00)
      return JSON.stringify(result, null, 2)
        .replace(/("outstandingBalance":\s*)"(-?\d+\.\d{2})"/g, "$1$2");
    }

    // ===== UI =====
    const output = document.getElementById("output");
    const downloadBtn = document.getElementById("download");
    let jsonText = "";

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      output.classList.remove("error");
      downloadBtn.disabled = true;
      try {
        const file = document.getElementById("file").files[0];
        jsonText = convert(await file.text());
        output.textContent = jsonText;
        downloadBtn.disabled = false;
      } catch (err) {
        output.classList.add("error");
        output.textContent = err.message;
      }
    });

    downloadBtn.addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([jsonText], { type: "application/json" }));
      a.download = "students.json";
      a.click();
    });
  </script>
</body>
</html>
